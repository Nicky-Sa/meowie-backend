name: Environment-Based Release

on:
  push:
    branches:
      - preview
      - production

permissions:
  contents: write

jobs:
  smart-release:
    runs-on: ubuntu-latest
    # Define env vars here to keep the code clean
    env:
      PREVIEW_BRANCH: preview
      PRODUCTION_BRANCH: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      # 1. Setup variables based on the branch
      - name: Set Release Config
        id: config
        run: |
          # We use the env vars defined at the job level
          if [[ "${{ github.ref_name }}" == "$PRODUCTION_BRANCH" ]]; then
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
            echo "SUFFIX=" >> $GITHUB_OUTPUT
            echo "Environment: Production (Release)"
          else
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
            echo "SUFFIX=beta" >> $GITHUB_OUTPUT
            echo "Environment: Preview (Pre-release)"
          fi

      # 2. Calculate Tag
      - name: Bump Version
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: "v"
          # We only append suffix if it's set (beta). If empty, it does nothing.
          append_to_pre_release_tag: ${{ steps.config.outputs.SUFFIX }}

      # 3. Create the Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          # Ternary operator to name the release dynamically
          name: ${{ github.ref_name == env.PRODUCTION_BRANCH && 'Production' || 'Preview' }} Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          prerelease: ${{ steps.config.outputs.IS_PRERELEASE }}
          draft: false
