name: Deploy and Release

on:
  push:
    branches:
      - preview
      - production

concurrency:
  group: vps-deployment
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # --- JOB 0: PREPARE (Calculate Version) ---
  prepare:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.calc_version.outputs.new_tag }}
      changelog: ${{ steps.calc_version.outputs.changelog }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'

      - name: Calculate Version
        id: calc_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: "v"
          dry_run: true
          release_branches: "preview,production"

  # --- JOB 1: DEPLOY TO AWS ---
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      DOCKER_BUILDKIT: 1
      BUILD_ENV: ${{ github.ref_name }}
      # Using run_number for Docker tag (e.g., preview-123)
      IMAGE_TAG: ${{ github.ref_name }}-${{ github.run_number }}
      ECR_BASE_URL: ${{ secrets.ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      # --- Infrastructure Setup ---
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to AWS ECR
        id: login-ecr
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} \
            | docker login --username AWS --password-stdin \
              ${{ env.ECR_BASE_URL }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install dependencies
        run: npm ci

      # --- Sentry ---
      - name: Upload source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: meowie-backend@${{ needs.prepare.outputs.new_tag }}
        run: |
          npm run build
          npm run sentry:sourcemaps

      # --- Database Migrations ---
      - name: Run Database Migrations
        env:
          # Required envs can be found in dbMigratorEnvConfig in env.config.ts
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_MIGRATOR_USER: ${{ secrets.DB_MIGRATOR_USER }}
          DB_MIGRATOR_PASSWORD: ${{ secrets.DB_MIGRATOR_PASSWORD }}
          DB_HOST_MIGRATOR: ${{ secrets.DB_HOST_MIGRATOR }}
        run: npm run migration:run

      - name: Format Version
        id: format
        run: |
          RAW_TAG="${{ needs.prepare.outputs.new_tag }}"
          CLEAN_VERSION="${RAW_TAG#v}"
          echo "APP_VERSION=$CLEAN_VERSION" >> "$GITHUB_ENV"

      # --- Build & Push ---
      - name: Build and Push Docker image
        run: |
          # Use buildx to build and push in one go (required for multi-arch/cross-compile)
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --build-arg BUILD_ENV=${{ env.BUILD_ENV }} \
            -t ${{ env.ECR_BASE_URL }}/${{ secrets.ECR_REPO }}:${{ env.IMAGE_TAG }} \
            --push \
            .

      # --- DEPLOYMENT STEP ---
      # --- STEP 1: Update the Environment Variables ---
      - name: Generate .env.local file for VPS
        run: |
          cat <<EOF > .env.local
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE=meowie-backend@${{ needs.prepare.outputs.new_tag }}
          PORT=${{ vars.PORT }}
          BUILD_ENV=${{ env.BUILD_ENV }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_APP_USER=${{ secrets.DB_APP_USER }}
          DB_APP_PASSWORD=${{ secrets.DB_APP_PASSWORD }}
          DB_HOST_POOLING=${{ secrets.DB_HOST_POOLING }}
          DB_MIGRATOR_USER=${{ secrets.DB_MIGRATOR_USER }}
          DB_MIGRATOR_PASSWORD=${{ secrets.DB_MIGRATOR_PASSWORD }}
          DB_HOST_MIGRATOR=${{ secrets.DB_HOST_MIGRATOR }}
          REDIS_ENDPOINT=${{ secrets.REDIS_ENDPOINT }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION=${{ vars.AWS_REGION }}
          SENDER_EMAIL=${{ vars.SENDER_EMAIL }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          JWT_REFRESH_EXPIRY=${{ vars.JWT_REFRESH_EXPIRY }}
          APP_VERSION=${{ env.APP_VERSION }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EOF

      - name: Copy .env.local to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ".env.local"
          target: "/home/${{ secrets.VPS_USERNAME }}/meowie-${{ env.BUILD_ENV }}"

      # --- STEP 2: Update the Code (Image) ---
      - name: Deploy Container on VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_URI: ${{ env.ECR_BASE_URL }}/${{ secrets.ECR_REPO }}:${{ env.IMAGE_TAG }}
          CONTAINER_NAME: meowie-${{ env.BUILD_ENV }}
          PORT: ${{ vars.PORT }}
          WORKDIR: /home/${{ secrets.VPS_USERNAME }}/meowie-${{ env.BUILD_ENV }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_URI,CONTAINER_NAME,PORT,WORKDIR
          script: |
            # Pull the new image (assumes VPS AWS CLI is authenticated)
            aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_BASE_URL }}
            docker pull $IMAGE_URI
            
            # Stop and remove old container
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true
            
            # Run new container
            docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              -p $PORT:$PORT \
              --env-file $WORKDIR/.env.local \
              $IMAGE_URI
            
            # Clean up old unused images to save disk space
            docker image prune -af

  # --- JOB 2: RELEASE (Runs only after Deploy succeeds) ---
  release:
    needs: [ prepare, deploy ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'

      - name: Manage Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VER: ${{ needs.prepare.outputs.new_tag }}
          CHANGELOG: ${{ needs.prepare.outputs.changelog }}
        run: |
          if [[ "${{ github.ref_name }}" == "production" ]]; then
            # 1. Create solid full release
            FINAL_TAG="$NEW_VER"
            gh release create "$FINAL_TAG" --title "Release $FINAL_TAG" --notes "$CHANGELOG" --repo ${{ github.repository }} --target ${{ github.sha }}
          
            # 2. Clean up beta release upon production deployment
            BETA_TAG="${NEW_VER}-beta"
            if gh release view "$BETA_TAG" --repo ${{ github.repository }} > /dev/null 2>&1; then
               echo "Found existing beta release: $BETA_TAG. Deleting it to avoid duplicate releases..."
               gh release delete "$BETA_TAG" --yes --cleanup-tag --repo ${{ github.repository }}
            fi
          else
            # 1. Create beta prerelease
            FINAL_TAG="${NEW_VER}-beta"
            if gh release view "$FINAL_TAG" --repo ${{ github.repository }} > /dev/null 2>&1; then
               echo "Found existing beta release. Deleting it so we can push the updated tag..."
               gh release delete "$FINAL_TAG" --yes --cleanup-tag --repo ${{ github.repository }}
               sleep 2
            fi
            gh release create "$FINAL_TAG" --title "Release $FINAL_TAG" --notes "$CHANGELOG" --prerelease --repo ${{ github.repository }} --target ${{ github.sha }}
          fi