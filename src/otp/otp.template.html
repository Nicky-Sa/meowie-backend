<!DOCTYPE html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>Meowie Verification Email</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
      :root {
          color-scheme: light dark;
          supported-color-schemes: light dark;
      }

      /* CSS Reset for Email Clients */
      body, table, td, a {
          -webkit-text-size-adjust: 100%;
          -ms-text-size-adjust: 100%;
      }

      table, td {
          mso-table-lspace: 0pt;
          mso-table-rspace: 0pt;
      }

      img {
          -ms-interpolation-mode: bicubic;
          border: 0;
          height: auto;
          line-height: 100%;
          outline: none;
          text-decoration: none;
      }

      body {
          margin: 0;
          padding: 0;
          width: 100% !important;
          -webkit-font-smoothing: antialiased;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      /* Dark Mode Overrides */
      @media (prefers-color-scheme: dark) {
          .body {
              background-color: #0a0a0a !important;
          }
          .main-table {
              background-color: #121212 !important;
              border-color: #232326 !important;
          }
          .text-white {
              color: #ffffff !important;
          }
          .text-muted {
              color: #a0a0a5 !important;
          }
          .text-footer {
              color: #707075 !important;
          }
          .otp-box {
              background-color: #f4f5f9 !important; /* Keep the OTP box light for contrast even in dark mode if desired, or darken it */
          }
      }

      /* Outlook Dark Mode Support */
      [data-ogsc] .body { background-color: #0a0a0a !important; }
      [data-ogsc] .main-table { background-color: #121212 !important; border-color: #232326 !important; }
      [data-ogsc] .text-white { color: #ffffff !important; }
      [data-ogsc] .text-muted { color: #a0a0a5 !important; }
      [data-ogsc] .text-footer { color: #707075 !important; }
  </style>
</head>
<body class="body" style="margin: 0; padding: 0; background-color: #0a0a0a; text-align: center;">

<table width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation"
       style="background-color: #0a0a0a; background-image: radial-gradient(circle at top, #1a273b 0%, #0a0a0a 60%); background-repeat: no-repeat; background-position: top center;">
  <tr>
    <td align="center" style="padding: 60px 20px;">

      <a href="https://meowie.app" style="display: inline-block; margin-bottom: 24px;">
        <img src="https://meowie-public.s3.eu-central-1.amazonaws.com/logo-with-type.png" alt="Meowie"
             style="display: block; border: 0; outline: none; text-decoration: none; height:36px">
      </a>

      <table class="main-table" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation"
             style="max-width: 600px; background-color: #121212; border: 1px solid #232326; border-radius: 16px; overflow: hidden; margin: 0 auto; color: #ffffff;">

        <tr>
          <td style="padding: 24px 32px; border-bottom: 1px solid #232326;">
            <table width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation">
              <tr>
                <td align="center" class="text-white" style="font-size: 22px; font-weight: 700; color: #ffffff;">
                  Verify your email
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td align="center" style="padding: 48px 32px;">
            <p class="text-white" style="margin: 0 0 16px 0; font-size: 16px; color: #ffffff;">
              Ready for movie night?
            </p>
            <p class="text-muted" style="margin: 0 auto 32px auto; font-size: 14px; color: #a0a0a5; line-height: 1.6; max-width: 420px;">
              Use the code below to securely log in or sign up. For your protection, this code will expire in 5 minutes.
            </p>

            <table class="otp-box" border="0" cellpadding="0" cellspacing="0" role="presentation"
                   style="margin: 0 auto; background-color: #f4f5f9; border-radius: 8px;">
              <tr>
                <td align="center"
                    style="padding: 16px 32px; font-size: 28px; font-weight: 700; font-family: 'Courier New', Courier, monospace; letter-spacing: 8px; color: #635bff;">
                  {{otp}}
                </td>
              </tr>
            </table>

            <p class="text-footer" style="margin: 32px 0 0 0; font-size: 13px; color: #707075;">
              If you didn't request this code, you can safely ignore this email.
            </p>
          </td>
        </tr>

        <tr>
          <td align="center" style="padding: 24px 32px; border-top: 1px solid #232326; background-color: #121212;">
            <p class="text-footer" style="margin: 0 0 16px 0; font-size: 12px; color: #707075;">
              © {{year}} Meowie. All rights reserved.
            </p>
            <a href="https://meowie.app" class="text-white"
               style="font-size: 12px; color: #ffffff; text-decoration: none; font-weight: 600;">
              Visit Meowie
            </a>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>

</body>
</html>
