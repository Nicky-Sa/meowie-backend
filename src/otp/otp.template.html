<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meowie Verification Email</title>
  <style>
      /* CSS Reset for Email Clients */
      body, table, td, a {
          -webkit-text-size-adjust: 100%;
          -ms-text-size-adjust: 100%;
      }

      table, td {
          mso-table-lspace: 0pt;
          mso-table-rspace: 0pt;
      }

      img {
          -ms-interpolation-mode: bicubic;
          border: 0;
          height: auto;
          line-height: 100%;
          outline: none;
          text-decoration: none;
      }

      body {
          margin: 0;
          padding: 0;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #0a0a0a; text-align: center;">

<table width="100%" border="0" cellpadding="0" cellspacing="0"
       style="background-color: #0a0a0a; background-image: radial-gradient(circle at top, #1a273b 0%, #0a0a0a 60%); background-repeat: no-repeat; background-position: top center; padding: 60px 20px;">
  <tr>
    <td align="center">

      <a href="#" style="display: inline-block; margin-bottom: 12px;">
        <img src="https://meowie-public.s3.eu-central-1.amazonaws.com/logo-with-type.png" alt="Meowie"
             style="display: block; border: 0; outline: none; text-decoration: none; height:72px">
      </a>

      <table width="100%" border="0" cellpadding="0" cellspacing="0"
             style="max-width: 600px; background-color: #121212; border: 1px solid #232326; border-radius: 16px; overflow: hidden; margin: 0 auto; color: #ffffff;">

        <tr>
          <td style="padding: 24px 32px; border-bottom: 1px solid #232326;">
            <table width="100%" border="0" cellpadding="0" cellspacing="0">
              <tr>
                <td align="left" style="font-size: 22px; font-weight: 700; color: #ffffff;">
                  Verify your email
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td align="center" style="padding: 48px 32px;">
            <p style="margin: 0 0 16px 0; font-size: 16px; color: #ffffff;">
              Ready for movie night?
            </p>
            <p style="margin: 0 auto 32px auto; font-size: 14px; color: #a0a0a5; line-height: 1.6; max-width: 420px;">
              Use the code below to securely log in or sign up. For your protection, this code will expire in 5 minutes.
            </p>

            <table border="0" cellpadding="0" cellspacing="0"
                   style="margin: 0 auto; background-color: #f4f5f9; border-radius: 8px;">
              <tr>
                <td align="center"
                    style="padding: 16px 32px; font-size: 28px; font-weight: 700; font-family: 'Courier New', Courier, monospace; letter-spacing: 8px; color: #635bff;">
                  {{otp}}
                </td>
              </tr>
            </table>

            <p style="margin: 32px 0 0 0; font-size: 13px; color: #707075;">
              If you didn't request this code, you can safely ignore this email.
            </p>
          </td>
        </tr>

        <tr>
          <td align="center" style="padding: 24px 32px; border-top: 1px solid #232326; background-color: ##121212;">
            <p style="margin: 0 0 16px 0; font-size: 12px; color: #707075;">
              © {{year}} Meowie. All rights reserved.
            </p>
            <a href="https://meowie.app"
               style="font-size: 12px; color: #ffffff; text-decoration: none; font-weight: 600;">
              Visit Meowie
            </a>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>

</body>
</html>
